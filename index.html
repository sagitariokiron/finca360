<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>FINCA360</title>
    <link rel="manifest" href="manifest.json">
    <style>
        html, body {
            margin: 0; padding: 0; width: 100%; height: 100%;
            overflow: hidden; background-color: #2c3e50; font-family: Arial, sans-serif;
        }
        iframe {
            width: 100%; height: 100%; border: none; display: block;
        }
        /* Pantalla de error oculta por defecto y sin parpadeos */
        #pantalla-offline {
            display: none; 
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background-color: #2c3e50; color: white;
            z-index: 9999; text-align: center;
            flex-direction: column; justify-content: center; align-items: center;
        }
        #pantalla-offline h2 { margin-bottom: 10px; color: #f1c40f; }
        #pantalla-offline p { margin: 0 20px; font-size: 1.2rem; }
    </style>
</head>
<body>

    <!-- Pantalla exclusiva para cuando el teléfono se queda 100% sin red -->
    <div id="pantalla-offline">
        <img src="Logo_Finca360_Final2.png" alt="Logo FINCA360" style="width: 180px; margin-bottom: 20px; border-radius: 15px;">
        <h2>No hay conexión a Internet</h2>
        <p>Tu dispositivo está desconectado. Por favor, revisa tus datos, cierra la aplicación y vuelve a ingresar.</p>
    </div>

    <!-- Tu aplicación libre para cargar a su ritmo -->
    <iframe id="mi-app" src="https://script.google.com/macros/s/AKfycbwImRaYqPhDvsJcb70Zqkc9s9yy6Ut-BYJwixOQKTQy4bQYM0avLwbYJ-N0YCJUdxvf/exec" allow="geolocation; camera; microphone"></iframe>

    <script>
        const pantallaOffline = document.getElementById('pantalla-offline');
        const iframeApp = document.getElementById('mi-app');

        // 1. Verificación inicial de arranque: Solo si arranca en modo avión puro
        if (!navigator.onLine) {
            iframeApp.style.display = 'none';
            pantallaOffline.style.display = 'flex';
        }

        // 2. Si el teléfono pierde la red de forma total mientras está abierto
        window.addEventListener('offline', function() {
            iframeApp.style.display = 'none';
            pantallaOffline.style.display = 'flex';
        });

        // NOTA: Quitamos el evento 'online' automático para evitar que 
        // los micro-cortes de la red "H" congelen o recarguen la app a la fuerza.

        // Celador (Service Worker)
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js');
        }
    </script>
</body>
</html>
