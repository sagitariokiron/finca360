<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>FINCA360</title>
    <link rel="manifest" href="manifest.json">
    <style>
        html, body {
            margin: 0; padding: 0; width: 100%; height: 100%;
            overflow: hidden; background-color: #2c3e50; font-family: Arial, sans-serif;
        }
        iframe {
            width: 100%; height: 100%; border: none; display: block;
        }
        /* Pantalla de advertencia corporativa (Apagada por defecto) */
        #pantalla-offline {
            display: none; 
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background-color: #2c3e50; color: white;
            z-index: 9999; text-align: center;
            flex-direction: column; justify-content: center; align-items: center;
        }
        #pantalla-offline h2 { margin-bottom: 10px; color: #f1c40f; }
        #pantalla-offline p { margin: 0 20px; font-size: 1.2rem; line-height: 1.5; }
    </style>
</head>
<body>

    <!-- Pantalla con instrucciones claras para redes lentas -->
    <div id="pantalla-offline">
        <img src="Logo_Finca360_Final2.png" alt="Logo FINCA360" style="width: 180px; margin-bottom: 20px; border-radius: 15px;">
        <h2 id="titulo-alerta">Señal deficiente o inestable (H / 3G)</h2>
        <p id="texto-alerta">La red móvil está muy lenta en este momento. Si la carga tarda demasiado, por favor cierre la aplicación y vuelva a abrirla, o espere a que la señal mejore a 4G.</p>
    </div>

    <!-- Tu aplicación -->
    <iframe id="mi-app" src="https://script.google.com/macros/s/AKfycbwImRaYqPhDvsJcb70Zqkc9s9yy6Ut-BYJwixOQKTQy4bQYM0avLwbYJ-N0YCJUdxvf/exec" allow="geolocation; camera; microphone"></iframe>

    <script>
        const pantallaOffline = document.getElementById('pantalla-offline');
        const iframeApp = document.getElementById('mi-app');
        const tituloAlerta = document.getElementById('titulo-alerta');
        const textoAlerta = document.getElementById('texto-alerta');
        
        let appCargadaExitosamente = false;

        // 1. Verificación instantánea si el teléfono está totalmente sin red (Modo Avión / X)
        if (!navigator.onLine) {
            iframeApp.style.display = 'none';
            tituloAlerta.innerText = "No hay conexión a Internet";
            textoAlerta.innerHTML = "Tu dispositivo está desconectado. Revisa tus datos y vuelve a ingresar.";
            pantallaOffline.style.display = 'flex';
        } else {
            // 2. Temporizador de paciencia (10 segundos)
            // Si hay Wi-Fi o 4G bueno, la app carga en 2 segundos, mata este reloj y no ves nada.
            // Si la red H o 3G se ahoga y pasan 10 segundos sin cargar, salta este escudo y muestra el mensaje.
            let temporizadorLentitud = setTimeout(function() {
                if (!appCargadaExitosamente) {
                    iframeApp.src = ''; // Cortamos la carga para evitar que Chrome saque la carita triste
                    iframeApp.style.display = 'none';
                    pantallaOffline.style.display = 'flex';
                }
            }, 10000);

            // 3. Si la app logra cargar a tiempo
            iframeApp.onload = function() {
                if (iframeApp.src !== '') {
                    clearTimeout(temporizadorLentitud);
                    appCargadaExitosamente = true;
                    pantallaOffline.style.display = 'none';
                    iframeApp.style.display = 'block';
                }
            };
        }

        // Si se pierde la red por completo durante el uso
        window.addEventListener('offline', function() {
            iframeApp.style.display = 'none';
            tituloAlerta.innerText = "Se perdió la conexión";
            textoAlerta.innerHTML = "Tu dispositivo se ha quedado sin red.";
            pantallaOffline.style.display = 'flex';
        });

        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js');
        }
    </script>
</body>
</html>
