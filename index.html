<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>FINCA360</title>
    <link rel="manifest" href="manifest.json">
    <style>
        html, body {
            margin: 0; padding: 0; width: 100%; height: 100%;
            overflow: hidden; background-color: #2c3e50; font-family: Arial, sans-serif;
        }
        iframe {
            width: 100%; height: 100%; border: none; display: block;
        }
        /* Diseño de la pantalla sin conexión */
        #pantalla-offline {
            display: none; /* Oculta por defecto */
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background-color: #2c3e50; color: white;
            z-index: 9999; text-align: center;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
        }
        #pantalla-offline h2 { margin-bottom: 10px; color: #f1c40f; }
        #pantalla-offline p { margin: 0 20px; font-size: 1.2rem; }
    </style>
</head>
<body>

    <!-- Esta es la pantalla que sale cuando se va el internet con tu logo -->
    <div id="pantalla-offline">
        <img src="Logo_Finca360_Final2.png" alt="Logo FINCA360" style="width: 180px; margin-bottom: 20px; border-radius: 15px;">
        <h2>Sin conexión a Internet</h2>
        <p>Por favor, revisa tu conexión de datos o Wi-Fi para poder ver el tablero.</p>
    </div>

    <!-- Tu aplicación intacta -->
    <iframe id="mi-app" src="https://script.google.com/macros/s/AKfycbwImRaYqPhDvsJcb70Zqkc9s9yy6Ut-BYJwixOQKTQy4bQYM0avLwbYJ-N0YCJUdxvf/exec" allow="geolocation; camera; microphone"></iframe>

    <!-- Código inteligente que detecta si hay internet y recarga para matar al dinosaurio -->
    <script>
        const pantallaOffline = document.getElementById('pantalla-offline');
        const iframeApp = document.getElementById('mi-app');
        
        let temporizadorCarga = null;
        let appCargadaExitosamente = false;

        function activarModoOffline() {
            if (!appCargadaExitosamente) {
                console.warn("⚠️ Señal muy débil o ausente. Forzando pantalla offline.");
                pantallaOffline.style.display = 'flex';
                iframeApp.style.display = 'none';
            }
        }

        // 1. Cronómetro de seguridad: Si en 4 segundos el iframe no carga, asumimos red caída
        function iniciarCronometroEmergencia() {
            appCargadaExitosamente = false;
            temporizadorCarga = setTimeout(activarModoOffline, 8000); // 8 segundos exactos
        }

        // 2. Si el iframe logra cargar bien, cancelamos el cronómetro y mostramos la app
        iframeApp.onload = function() {
            clearTimeout(temporizadorCarga);
            appCargadaExitosamente = true;
            pantallaOffline.style.display = 'none';
            iframeApp.style.display = 'block';
            console.log("✅ Aplicación cargada correctamente.");
        };

        // 3. Validación inicial al abrir la app
        if (!navigator.onLine) {
            activarModoOffline();
        } else {
            iniciarCronometroEmergencia();
        }

        // Escuchar cambios de red en vivo por si recupera señal
        window.addEventListener('online', function() {
            window.location.reload(); // Recarga limpia si vuelve el internet
        });
        
        window.addEventListener('offline', function() {
            activarModoOffline();
        });

        // Aquí conectamos al celador (Service Worker)
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js');
        }
    </script>
</body>
</html>
