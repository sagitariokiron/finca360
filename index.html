<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>FINCA360</title>
    <link rel="manifest" href="manifest.json">
    <style>
        html, body {
            margin: 0; padding: 0; width: 100%; height: 100%;
            overflow: hidden; background-color: #2c3e50; font-family: Arial, sans-serif;
        }
        iframe {
            width: 100%; height: 100%; border: none; display: block;
        }
        /* Pantalla de advertencia exclusiva para redes lentas */
        #pantalla-offline {
            display: none; 
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background-color: #2c3e50; color: white;
            z-index: 9999; text-align: center;
            flex-direction: column; justify-content: center; align-items: center;
        }
        #pantalla-offline h2 { margin-bottom: 10px; color: #f1c40f; }
        #pantalla-offline p { margin: 0 20px; font-size: 1.2rem; }
    </style>
</head>
<body>

    <!-- Pantalla de advertencia -->
    <div id="pantalla-offline">
        <img src="Logo_Finca360_Final2.png" alt="Logo FINCA360" style="width: 180px; margin-bottom: 20px; border-radius: 15px;">
        <h2 id="titulo-alerta">Señal deficiente o inestable</h2>
        <p id="texto-alerta">La red H/3G está lenta. Por favor espera un momento, la aplicación está intentando cargar...</p>
    </div>

    <!-- Tu aplicación -->
    <iframe id="mi-app" src="https://script.google.com/macros/s/AKfycbwImRaYqPhDvsJcb70Zqkc9s9yy6Ut-BYJwixOQKTQy4bQYM0avLwbYJ-N0YCJUdxvf/exec" allow="geolocation; camera; microphone"></iframe>

    <script>
        const pantallaOffline = document.getElementById('pantalla-offline');
        const iframeApp = document.getElementById('mi-app');
        const tituloAlerta = document.getElementById('titulo-alerta');
        const textoAlerta = document.getElementById('texto-alerta');
        
        let appCargadaExitosamente = false;

        // 1. Si no hay red en absoluto (Modo Avión / X)
        if (!navigator.onLine) {
            iframeApp.style.display = 'none';
            tituloAlerta.innerText = "No hay conexión a Internet";
            textoAlerta.innerHTML = "Tu dispositivo está desconectado. Revisa tus datos y vuelve a ingresar.";
            pantallaOffline.style.display = 'flex';
        } else {
            // 2. Detectar inteligentemente el tipo de red del teléfono
            const connection = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
            let esRedLenta = false;

            if (connection) {
                // Si el navegador reporta explícitamente que estamos en 3G, 2G o slow-2g (lo que incluye H y 3G)
                if (connection.effectiveType === '3g' || connection.effectiveType === '2g' || connection.effectiveType === 'slow-2g') {
                    esRedLenta = true;
                }
            }

            // 3. Comportamiento condicional estricto:
            if (esRedLenta) {
                // SI ES H o 3G: Activamos el temporizador de paciencia con aviso corporativo
                let temporizadorEspera = setTimeout(function() {
                    if (!appCargadaExitosamente) {
                        pantallaOffline.style.display = 'flex';
                    }
                }, 15000);

                iframeApp.onload = function() {
                    clearTimeout(temporizadorEspera);
                    appCargadaExitosamente = true;
                    pantallaOffline.style.display = 'none';
                    iframeApp.style.display = 'block';
                };
            } else {
                // SI ES 4G o Wi-Fi: Cero temporizadores, cero avisos. Carga limpia y directa siempre.
                iframeApp.onload = function() {
                    appCargadaExitosamente = true;
                    pantallaOffline.style.display = 'none';
                    iframeApp.style.display = 'block';
                };
            }
        }

        // Si se pierde la red por completo durante el uso
        window.addEventListener('offline', function() {
            iframeApp.style.display = 'none';
            tituloAlerta.innerText = "Se perdió la conexión";
            textoAlerta.innerHTML = "Tu dispositivo se ha quedado sin red.";
            pantallaOffline.style.display = 'flex';
        });

        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js');
        }
    </script>
</body>
</html>
